# =============================================================================
#  Test gh-action-imagebuilder
# -----------------------------------------------------------------------------
#  Builds firmware for a matrix of architectures on every pull request to
#  make sure the action itself keeps working (like gh-action-sdk test.yml).
#  Versions are auto-detected from this repo's v24.* / v25.* release tags.
# =============================================================================

name: Test

on:
  pull_request:

jobs:
  build:
    name: Test ${{ matrix.arch }} / ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86-64
            version: '24'
          - arch: x86-64
            version: '25'
          - arch: rockchip-armv8
            version: '25'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build firmware
        id: build
        uses: ./
        with:
          arch: ${{ matrix.arch }}
          version: ${{ matrix.version }}
          profile: generic
          rootfs_partsize: 1024
          lan_ip: 192.168.1.1

      - name: Verify firmware artifacts
        run: |
          find "${{ steps.build.outputs.firmware_dir }}" -type f | grep -q . \
            && echo "✅ 固件产物生成成功" || { echo "❌ 未找到固件产物"; exit 1; }
